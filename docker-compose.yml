# Standalone Docker Compose for local running or self-hosting
services:
  web:
    image: nginx:alpine
    container_name: baby-name-ranker
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
