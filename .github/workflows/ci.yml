name: CI & Deploy

# Tests every push and pull request; a push to main is deployed to
# https://baby.casteleijn.com (static nginx container on the Omarchy server).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Check that the committed CSS is up to date
        run: |
          if ! git diff --quiet -- css/tailwind.css; then
            echo "::error::css/tailwind.css is out of date: run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Validate translations & run test suite
        run: npm test

      - name: Package site
        run: ./scripts/package-site.sh

      - name: Upload site package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/site.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to baby.casteleijn.com
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://baby.casteleijn.com
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download site package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site

      # The server (Omarchy) is reachable only over Tailscale. Joins as an
      # ephemeral tag:ci node; the tailnet policy lets tag:ci reach omarchy on
      # tcp/22 and tcp/443 only.
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: omarchy.tail0118fa.ts.net

      - name: Configure SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::PROD_SSH_KEY / PROD_SSH_KNOWN_HOSTS are not set in the production environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      # The key is pinned on the server to `deploy-static baby` (SSH forced
      # command): it reads the package from stdin, tests the nginx config,
      # swaps the files and rolls back when the site does not answer.
      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$SSH_TARGET" "$GITHUB_SHA" < site.tar.gz

      - name: Check the live site
        run: |
          for _ in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://baby.casteleijn.com/ || true)"
            [ "$code" = "200" ] && { echo "https://baby.casteleijn.com answers 200"; exit 0; }
            sleep 3
          done
          echo "::error::https://baby.casteleijn.com answered $code"
          exit 1
